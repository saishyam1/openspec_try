<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Currency Converter</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      color: #1e293b;
    }

    .card {
      background: white;
      border-radius: 1.5rem;
      box-shadow: 0 32px 64px rgba(0,0,0,0.35);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 480px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 800;
      color: #0f172a;
      text-align: center;
      margin-bottom: .25rem;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      font-size: .9rem;
      margin-bottom: 2rem;
    }

    label {
      display: block;
      font-size: .8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: #475569;
      margin-bottom: .4rem;
    }

    .field { margin-bottom: 1.25rem; }

    input[type="number"], select {
      width: 100%;
      padding: .75rem 1rem;
      border: 2px solid #e2e8f0;
      border-radius: .75rem;
      font-size: 1.1rem;
      color: #0f172a;
      background: #f8fafc;
      outline: none;
      transition: border-color .2s;
      appearance: none;
    }

    input[type="number"]:focus, select:focus { border-color: #2563eb; background: white; }

    .row { display: grid; grid-template-columns: 1fr auto 1fr; gap: .75rem; align-items: end; margin-bottom: 1.25rem; }

    .swap-btn {
      background: #eff6ff;
      border: 2px solid #bfdbfe;
      border-radius: .75rem;
      padding: .7rem .9rem;
      cursor: pointer;
      font-size: 1.3rem;
      line-height: 1;
      color: #2563eb;
      transition: background .2s, transform .15s;
      margin-bottom: 0;
      height: fit-content;
      align-self: end;
      padding-bottom: .75rem;
    }

    .swap-btn:hover { background: #dbeafe; transform: rotate(180deg); }

    .convert-btn {
      width: 100%;
      padding: .9rem;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border: none;
      border-radius: .75rem;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
      margin-top: .25rem;
    }

    .convert-btn:hover { opacity: .9; transform: translateY(-1px); }
    .convert-btn:active { transform: translateY(0); }

    .result {
      margin-top: 1.5rem;
      background: linear-gradient(135deg, #eff6ff, #dbeafe);
      border: 2px solid #bfdbfe;
      border-radius: 1rem;
      padding: 1.25rem 1.5rem;
      text-align: center;
      display: none;
    }

    .result.show { display: block; }

    .result-amount {
      font-size: 2rem;
      font-weight: 800;
      color: #1d4ed8;
      line-height: 1.2;
    }

    .result-label {
      font-size: .9rem;
      color: #64748b;
      margin-top: .4rem;
    }

    .result-rate {
      font-size: .82rem;
      color: #94a3b8;
      margin-top: .35rem;
    }

    .error {
      margin-top: 1.25rem;
      background: #fef2f2;
      border: 2px solid #fecaca;
      border-radius: .75rem;
      padding: .9rem 1rem;
      color: #dc2626;
      font-size: .9rem;
      text-align: center;
      display: none;
    }

    .error.show { display: block; }

    footer {
      margin-top: 1.75rem;
      text-align: center;
      font-size: .78rem;
      color: rgba(255,255,255,0.5);
    }

    footer a { color: rgba(255,255,255,0.75); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="card">
  <h1>💱 Currency Converter</h1>
  <p class="subtitle">Fast, offline-capable · 20 currencies supported</p>

  <div class="field">
    <label for="amount">Amount</label>
    <input type="number" id="amount" placeholder="100" min="0.000001" step="any" value="100" />
  </div>

  <div class="row">
    <div>
      <label for="from">From</label>
      <select id="from"></select>
    </div>
    <button class="swap-btn" id="swapBtn" title="Swap currencies">⇄</button>
    <div>
      <label for="to">To</label>
      <select id="to"></select>
    </div>
  </div>

  <button class="convert-btn" id="convertBtn">Convert</button>

  <div class="result" id="result">
    <div class="result-amount" id="resultAmount"></div>
    <div class="result-label" id="resultLabel"></div>
    <div class="result-rate" id="resultRate"></div>
  </div>

  <div class="error" id="error"></div>
</div>

<footer>
  Built with ❤️ using Spec-Driven Development ·
  <a href="https://github.com/saishyam1/openspec_try" target="_blank">View on GitHub</a>
</footer>

<script>
  // Rate table — 1 USD = X of the listed currency (mirrors app/converter.py)
  const RATES = {
    USD: 1.0,    EUR: 0.92,   GBP: 0.79,   INR: 83.52,
    JPY: 157.30, AUD: 1.54,   CAD: 1.37,   CHF: 0.90,
    CNY: 7.24,   SGD: 1.35,   MXN: 17.15,  BRL: 5.08,
    KRW: 1350.0, HKD: 7.82,   SEK: 10.42,  NOK: 10.55,
    DKK: 6.88,   NZD: 1.64,   ZAR: 18.63,  AED: 3.67,
  };

  const NAMES = {
    USD: "US Dollar",         EUR: "Euro",
    GBP: "British Pound",     INR: "Indian Rupee",
    JPY: "Japanese Yen",      AUD: "Australian Dollar",
    CAD: "Canadian Dollar",   CHF: "Swiss Franc",
    CNY: "Chinese Yuan",      SGD: "Singapore Dollar",
    MXN: "Mexican Peso",      BRL: "Brazilian Real",
    KRW: "South Korean Won",  HKD: "Hong Kong Dollar",
    SEK: "Swedish Krona",     NOK: "Norwegian Krone",
    DKK: "Danish Krone",      NZD: "New Zealand Dollar",
    ZAR: "South African Rand",AED: "UAE Dirham",
  };

  // Populate selects
  const fromSel = document.getElementById("from");
  const toSel   = document.getElementById("to");

  Object.entries(NAMES).forEach(([code, name]) => {
    const opt = (sel, selected) => {
      const o = document.createElement("option");
      o.value = code;
      o.textContent = `${code} — ${name}`;
      if (selected) o.selected = true;
      sel.appendChild(o);
    };
    opt(fromSel, code === "USD");
    opt(toSel,   code === "INR");
  });

  // Conversion
  function doConvert() {
    const amount = parseFloat(document.getElementById("amount").value);
    const from   = fromSel.value;
    const to     = toSel.value;
    const resultEl = document.getElementById("result");
    const errorEl  = document.getElementById("error");

    resultEl.classList.remove("show");
    errorEl.classList.remove("show");

    if (!amount || amount <= 0) {
      errorEl.textContent = "Please enter a positive amount.";
      errorEl.classList.add("show");
      return;
    }

    // Convert via USD base: amount / from_rate * to_rate
    const inUsd    = amount / RATES[from];
    const converted = +(inUsd * RATES[to]).toFixed(6);
    const rate      = +(converted / amount).toFixed(6);

    document.getElementById("resultAmount").textContent =
      `${converted.toLocaleString(undefined, { maximumFractionDigits: 4 })} ${to}`;
    document.getElementById("resultLabel").textContent =
      `${amount.toLocaleString()} ${from}  →  ${NAMES[to]}`;
    document.getElementById("resultRate").textContent =
      `1 ${from} = ${rate} ${to}`;

    resultEl.classList.add("show");
  }

  document.getElementById("convertBtn").addEventListener("click", doConvert);
  document.getElementById("amount").addEventListener("keydown", e => { if (e.key === "Enter") doConvert(); });

  // Swap currencies
  document.getElementById("swapBtn").addEventListener("click", () => {
    const tmp = fromSel.value;
    fromSel.value = toSel.value;
    toSel.value = tmp;
    doConvert();
  });

  // Auto-convert on load
  doConvert();
</script>
</body>
</html>
